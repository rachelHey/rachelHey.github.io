website:
  title: "Rachel Heyard"
  site-url: https://rachelheyard.com
  description: "Meta-researcher and statistician at the University of Zurich"
  open-graph: true
  navbar:
    background: "#ffffff"
    foreground: "#2b2b2b"
    collapse-below: md
    right:
      - href: index.qmd
        text: About
      - href: projects.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: talks.qmd
        text: Talks
      - icon: github
        href: https://github.com/rachelHey
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/rachel-heyard-3145aa91/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:rachel.heyard@uzh.ch
        aria-label: Email
  page-footer:
    border: false
    center: "© 2026 Rachel Heyard · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: default
    css: styles.css
    toc: false
    linkcolor: "#3d6e94"
    fontsize: 1rem
    grid:
      body-width: 760px
    smooth-scroll: true
